# Локальное окружение для разработки KhubiyInc Workshop.
# Запуск:  docker compose -f docker-compose.dev.yml up -d
# Остановка с сохранением данных:  docker compose -f docker-compose.dev.yml down
# Сброс с удалением данных:  docker compose -f docker-compose.dev.yml down -v
#
# Production compose (Traefik, PgBouncer, FastAPI ×2, arq) — в docker-compose.prod.yml
# (будет добавлен в Phase 0.7).

name: khubiy-workshop-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: khubiy-workshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: khubiy_workshop_dev
      # Локаль для unaccent / pg_trgm
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khubiy_workshop_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: khubiy-workshop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # MinIO — S3-совместимое локальное хранилище для разработки. В проде
  # используется Selectel Cloud Storage (S3-совместимый API).
  # UI:  http://localhost:9001 (admin/admin12345)
  # API: http://localhost:9000
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: khubiy-workshop-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_admin12345
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Создаёт бакеты при первом старте. После успешного выполнения контейнер
  # завершается; повторный запуск идемпотентен.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
        mc alias set local http://minio:9000 minio_admin minio_admin12345 &&
        mc mb --ignore-existing local/khubiy-files &&
        mc mb --ignore-existing local/khubiy-public &&
        mc mb --ignore-existing local/khubiy-temp &&
        mc anonymous set download local/khubiy-public &&
        mc ilm rule add local/khubiy-temp --expire-days 1 || true &&
        echo 'MinIO buckets ready'
      "
    restart: "no"

  # Mailpit — локальный SMTP-улавливатель для разработки. Заменяет реальный
  # email-провайдер (Unisender/SendPulse/Mailgun) — будет использован в проде.
  # UI:  http://localhost:8025
  # SMTP: localhost:1025 (без auth)
  # HTTP API: http://localhost:8025/api/v1/messages — используется в тестах.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: khubiy-workshop-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # Web UI + HTTP API
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8025/livez || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
    name: khubiy-workshop-postgres-data
  redis-data:
    name: khubiy-workshop-redis-data
  mailpit-data:
    name: khubiy-workshop-mailpit-data
  minio-data:
    name: khubiy-workshop-minio-data
