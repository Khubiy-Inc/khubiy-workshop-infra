# Production compose для KhubiyInc Workshop.
#
# Стек:
#   Caddy (TLS + reverse proxy) → web (nginx SPA) + api (FastAPI) →
#   Postgres + Redis + MinIO.
#
# Запуск:
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Образы тянутся из ghcr.io/khubiy-inc/khubiy-workshop-{api,web}:<tag>.
# Build workflow'ы в репо `khubiy-workshop-api` и `khubiy-workshop-web`
# публикуют на каждый push в main.
#
# TLS: Caddy автоматически берёт Let's Encrypt cert'ы (HTTP-01 challenge).
# Конфиг роутинга — Caddyfile (читается из тома).

name: khubiy-workshop-prod

x-api-env: &api-env
  KW_ENVIRONMENT: production
  KW_LOG_FORMAT: json
  KW_LOG_LEVEL: INFO
  KW_DATABASE_URL: postgresql+asyncpg://khubiy_app:${KW_DB_APP_PASSWORD}@postgres:5432/khubiy_workshop
  KW_DATABASE_URL_ADMIN: postgresql+asyncpg://khubiy_admin:${KW_DB_ADMIN_PASSWORD}@postgres:5432/khubiy_workshop
  KW_REDIS_URL: redis://redis:6379/0
  KW_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
  KW_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
  KW_SENTRY_DSN: ${KW_SENTRY_DSN:-}
  KW_SENTRY_TRACES_SAMPLE_RATE: ${KW_SENTRY_TRACES_SAMPLE_RATE:-0.05}
  KW_CORS_ORIGINS: '["https://workshop.${KW_PRIMARY_DOMAIN}"]'
  KW_WEBPUSH_VAPID_PUBLIC_KEY: ${KW_WEBPUSH_VAPID_PUBLIC_KEY}
  KW_WEBPUSH_VAPID_PRIVATE_KEY: ${KW_WEBPUSH_VAPID_PRIVATE_KEY}
  KW_WEBPUSH_VAPID_EMAIL: mailto:${KW_WEBPUSH_VAPID_EMAIL}
  KW_WEBAUTHN_RP_ID: workshop.${KW_PRIMARY_DOMAIN}
  KW_WEBAUTHN_RP_NAME: KhubiyInc Workshop
  KW_WEBAUTHN_RP_ORIGIN: https://workshop.${KW_PRIMARY_DOMAIN}
  KW_S3_ENDPOINT_URL: http://minio:9000
  KW_S3_REGION: ${KW_S3_REGION:-ru-1}
  KW_S3_BUCKET: ${KW_S3_BUCKET:-khubiy-workshop}
  KW_S3_ACCESS_KEY: ${KW_S3_ACCESS_KEY}
  KW_S3_SECRET_KEY: ${KW_S3_SECRET_KEY}
  KW_S3_USE_PATH_STYLE: 'true'
  KW_SMTP_HOST: ${KW_SMTP_HOST:-}
  KW_SMTP_PORT: ${KW_SMTP_PORT:-587}
  KW_SMTP_USER: ${KW_SMTP_USER:-}
  KW_SMTP_PASSWORD: ${KW_SMTP_PASSWORD:-}
  KW_SMTP_FROM: ${KW_SMTP_FROM:-noreply@${KW_PRIMARY_DOMAIN}}
  # Email через Resend (HTTP API). Если KW_RESEND_API_KEY задан в .env —
  # backend шлёт через Resend, иначе через SMTP выше. From-домен обязан быть
  # верифицирован в Resend (SPF/DKIM). KW_WEB_BASE_URL — ссылка «Войти» в письмах.
  KW_RESEND_API_KEY: ${KW_RESEND_API_KEY:-}
  KW_EMAIL_FROM: ${KW_EMAIL_FROM:-no-reply@${KW_PRIMARY_DOMAIN}}
  KW_EMAIL_FROM_NAME: ${KW_EMAIL_FROM_NAME:-Khubiy Workshop}
  KW_WEB_BASE_URL: https://workshop.${KW_PRIMARY_DOMAIN}

services:
  # --------------------------------------------------------------------------
  # Reverse proxy + automatic TLS (Caddy 2)
  # --------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      PRIMARY_DOMAIN: ${KW_PRIMARY_DOMAIN}
      ACME_EMAIL: ${TRAEFIK_ACME_EMAIL}
    networks:
      - public
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # --------------------------------------------------------------------------
  # Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${KW_DB_SUPER_PASSWORD}
      POSTGRES_DB: khubiy_workshop
      KW_DB_ADMIN_PASSWORD: ${KW_DB_ADMIN_PASSWORD}
      KW_DB_APP_PASSWORD: ${KW_DB_APP_PASSWORD}
      KW_DB_READONLY_PASSWORD: ${KW_DB_READONLY_PASSWORD:-khubiy_readonly_dev_password}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d khubiy_workshop"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Cache / lockouts / outbox JTI store / whitelist refresh-токенов
  #
  # ВАЖНО: policy = noeviction. Redis хранит whitelist рефреш-токенов
  # (auth:refresh:<jti>, TTL 7д) — на нём держится длительность сессии.
  # При allkeys-lru Redis под нагрузкой вытеснял эти ключи ДО истечения TTL,
  # рефреш падал с refresh_revoked → пользователя выкидывало из аккаунта
  # «спустя время». noeviction + запас памяти: auth-ключи переживают TTL,
  # кэш-ключи всё равно с собственным TTL и истекают сами.
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - internal

  # --------------------------------------------------------------------------
  # S3-compatible object storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${KW_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${KW_S3_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: https://minio.${KW_PRIMARY_DOMAIN}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Bucket auto-create (one-shot)
  # --------------------------------------------------------------------------
  minio-init:
    image: minio/mc:RELEASE.2025-04-08T15-39-49Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${KW_S3_ACCESS_KEY} ${KW_S3_SECRET_KEY} &&
      mc mb --ignore-existing local/${KW_S3_BUCKET:-khubiy-workshop} &&
      mc anonymous set download local/${KW_S3_BUCKET:-khubiy-workshop} || true
      "
    restart: "no"
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Backend API (FastAPI)
  # --------------------------------------------------------------------------
  api:
    image: ghcr.io/khubiy-inc/khubiy-workshop-api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Host-публикация для общего host-nginx (ingress на VPS проксирует
    # workshop.khubiyinc.ru/api -> 127.0.0.1:8010). Без этого пересоздание
    # api на деплое теряет порт -> host-nginx 502. Раньше держалось ручной
    # правкой compose на VPS, но git reset --hard в деплое её затирал.
    ports:
      - "127.0.0.1:8010:8000"
    environment: *api-env
    secrets:
      - jwt_private.pem
      - jwt_public.pem
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0) if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal

  # --------------------------------------------------------------------------
  # API one-shot migration job (запускается при каждом deploy)
  # --------------------------------------------------------------------------
  api-migrate:
    image: ghcr.io/khubiy-inc/khubiy-workshop-api:${API_IMAGE_TAG:-latest}
    restart: "no"
    environment: *api-env
    secrets:
      - jwt_private.pem
      - jwt_public.pem
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    networks:
      - internal

  # --------------------------------------------------------------------------
  # Web SPA (nginx + Vite bundle)
  # --------------------------------------------------------------------------
  web:
    image: ghcr.io/khubiy-inc/khubiy-workshop-web:${WEB_IMAGE_TAG:-latest}
    restart: unless-stopped
    # Host-публикация для общего host-nginx (ingress проксирует
    # workshop.khubiyinc.ru/ -> 127.0.0.1:8011). Без этого пересоздание web
    # на деплое теряет порт -> host-nginx 502 (инцидент 2026-06-23).
    ports:
      - "127.0.0.1:8011:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - internal

volumes:
  postgres-data:
    name: khubiy-workshop-postgres-data
  redis-data:
    name: khubiy-workshop-redis-data
  minio-data:
    name: khubiy-workshop-minio-data
  caddy-data:
    name: khubiy-workshop-caddy-data
  caddy-config:
    name: khubiy-workshop-caddy-config

networks:
  public:
    name: khubiy-workshop-prod_public
  internal:
    name: khubiy-workshop-prod_internal
    internal: false  # api нужен исходящий доступ для webhooks/email/Sentry/Expo Push

secrets:
  jwt_private.pem:
    file: ./secrets/jwt_private.pem
  jwt_public.pem:
    file: ./secrets/jwt_public.pem
